<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block World</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div id="game"></div>

    <div id="crosshair"></div>

    <div id="fps">
        FPS: 0
    </div>

    <div id="hotbar">

        <div class="slot selected" data-block="grass">
            1<br>
            GRAMA
        </div>

        <div class="slot" data-block="dirt">
            2<br>
            TERRA
        </div>

        <div class="slot" data-block="stone">
            3<br>
            PEDRA
        </div>

        <div class="slot" data-block="wood">
            4<br>
            MADEIRA
        </div>

    </div>

    <div id="startScreen">

        <h1>BLOCK WORLD</h1>

        <p>WASD - Mover</p>
        <p>Mouse - Olhar</p>
        <p>Espaço - Pular</p>
        <p>Botão esquerdo - Quebrar</p>
        <p>Botão direito - Colocar bloco</p>

        <button id="startButton">
            JOGAR
        </button>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Nosso jogo -->
    <script src="script.js"></script>

</body>
</html>
