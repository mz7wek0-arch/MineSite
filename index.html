<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>J01N TH3 3MP1R3!</title>

  <link
    rel="stylesheet"
    href="estilo.css"
  >

</head>

<body>

  <div id="interfaceJogo">

    <div id="mira">+</div>

    <div id="fps">
      FPS: --
    </div>

    <div id="statusMovimento">
      ANDANDO
    </div>

    <div id="quebrando">

      <div id="textoQuebrando">
        Quebrando
      </div>

      <div id="barraQuebrando">

        <div
          id="progressoQuebrando"
        ></div>

      </div>

    </div>

    <div id="blocoSelecionado">

      <span id="nomeBloco">
        Pedra
      </span>

      <div
        id="corSelecionada"
        class="bloco azul"
      ></div>

    </div>

    <div id="barraBlocos">

      <div
        class="slot selecionado"
        id="slot1"
      >

        <span class="numero">1</span>

        <div
          class="bloco azul"
        ></div>

        <span
          class="quantidade"
          id="quantidade1"
        >
          0
        </span>

      </div>

      <div
        class="slot"
        id="slot2"
      >

        <span class="numero">2</span>

        <div
          class="bloco verde"
        ></div>

        <span
          class="quantidade"
          id="quantidade2"
        >
          0
        </span>

      </div>

      <div
        class="slot"
        id="slot3"
      >

        <span class="numero">3</span>

        <div
          class="bloco vermelho"
        ></div>

        <span
          class="quantidade"
          id="quantidade3"
        >
          0
        </span>

      </div>

      <div
        class="slot"
        id="slot4"
      >

        <span class="numero">4</span>

        <div
          class="bloco madeira"
        ></div>

        <span
          class="quantidade"
          id="quantidade4"
        >
          0
        </span>

      </div>

      <div
        class="slot"
        id="slot5"
      >

        <span class="numero">5</span>

        <div
          class="bloco terra"
        ></div>

        <span
          class="quantidade"
          id="quantidade5"
        >
          0
        </span>

      </div>

      <div
        class="slot"
        id="slot6"
      >

        <span class="numero">6</span>

        <div
          class="bloco areia"
        ></div>

        <span
          class="quantidade"
          id="quantidade6"
        >
          0
        </span>

      </div>

    </div>

  </div>

<script type="module" src="script.js?v=999"></script>

</body>

</html>
